# Example only. In a real cluster use External Secrets / sealed-secrets, never commit real values.
apiVersion: v1
kind: Secret
metadata: { name: webhook-relay }
type: Opaque
stringData:
  DATABASE_URL: postgres://webhook:CHANGE_ME@postgres.default.svc:5432/webhook?sslmode=disable
  REDIS_URL: redis://redis.default.svc:6379/0
